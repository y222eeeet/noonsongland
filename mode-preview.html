<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>송이 모드 프리뷰</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; background: #ede8f4; color: #534465; font: 600 15px system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 24px; padding: 16px; background: #faf7fd; }
    h1 { font-size: 17px; margin: 0; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    button { border: 1px solid #d4c7e1; border-radius: 100px; padding: 8px 13px; background: white; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #70558d; border-color: #70558d; color: white; }
    main { min-height: 360px; position: relative; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <h1>송이 모드 프리뷰</h1>
    <div id="modes" class="controls" role="group" aria-label="모드"></div>
    <div id="phases" class="controls" role="group" aria-label="동작"></div>
    <div class="controls" role="group" aria-label="카메라">
      <button id="front" type="button">정면</button>
      <button id="side" type="button">옆면</button>
    </div>
  </header>
  <main aria-label="드래그해서 관찰 각도 회전"></main>
  <script type="module" src="/src/game/mode-preview.js"></script>
</body>
</html>
